name: Rust

on:
  workflow_dispatch:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main", "dev"]

concurrency:
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.sha) || format('ci-{0}', github.ref) }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lints:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Lint Linux without OpenSSL: the native-tls backend needs a system
      # OpenSSL, so Linux CI standardizes on the rustls feature set (the same
      # one the musl build legs use). Windows build legs still compile the
      # default native-tls/Schannel feature set.
      - name: Clippy
        run: >
          cargo clippy --no-default-features
          --features server,client,rustls,noise,websocket-rustls,hot-reload
          -- -D warnings
      - name: Setup cargo-hack
        run: cargo install cargo-hack
      - name: Check all features
        run: >
          cargo hack check --feature-powerset --no-dev-deps
          --exclude-features default,native-tls,websocket-native-tls

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: i686-pc-windows-msvc
            build: cargo
            cross: false
            native_test: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            build: cargo
            cross: false
            native_test: true
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            build: cargo
            cross: false
            native_test: false
          - os: ubuntu-latest
            target: i686-unknown-linux-musl
            build: cross
            cross: true
            native_test: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: cross
            cross: true
            native_test: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            build: cross
            cross: true
            native_test: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: cross
            cross: true
            native_test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        # One cache per target: the default key is shared across the matrix,
        # and target/ holds host build-script binaries that are only runnable
        # in the cross image that compiled them (glibc baselines differ).
        with:
          key: ${{ matrix.target }}
      # Linux musl builds are rustls-only: native-tls cannot find a target
      # OpenSSL sysroot in cross containers. Windows legs keep default
      # features (Schannel has no external dependency).
      - name: Run rustls tests
        if: matrix.native_test
        run: >
          ${{ matrix.build }} test --locked --target ${{ matrix.target }} --verbose
          --no-default-features --features server,client,rustls,noise,websocket-rustls,hot-reload
      - name: Compile target
        run: >
          ${{ matrix.build }} build --locked --target ${{ matrix.target }}
          ${{
            matrix.build == 'cross'
            && '--no-default-features --features server,client,rustls,noise,websocket-rustls,hot-reload'
            || ''
          }}
