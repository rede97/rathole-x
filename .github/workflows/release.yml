name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-pc-windows-msvc
            native_test: false
          - target: x86_64-pc-windows-msvc
            native_test: true
          - target: aarch64-pc-windows-msvc
            native_test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Run native tests
        if: matrix.native_test
        run: cargo test --locked --release --target ${{ matrix.target }} --verbose
      - name: Build release
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package release
        shell: pwsh
        run: |
          $archive = "rathole-x-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/rathole-x.exe" -DestinationPath $archive
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}
          path: rathole-x-${{ matrix.target }}.zip
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-musl
            native_test: false
          - target: x86_64-unknown-linux-musl
            native_test: true
          - target: armv7-unknown-linux-musleabihf
            native_test: false
          - target: aarch64-unknown-linux-musl
            native_test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
      - name: Run native tests
        if: matrix.native_test
        run: cross test --locked --release --target ${{ matrix.target }} --verbose
      - name: Build release
        run: cross build --locked --release --target ${{ matrix.target }}
      - name: Package release
        run: >
          tar -czf rathole-x-${{ matrix.target }}.tar.gz
          -C target/${{ matrix.target }}/release rathole-x
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: rathole-x-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, linux]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
