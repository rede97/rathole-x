name: Release

# Windows-only for now. The full cross-platform matrix was deliberately
# reduced: Linux/macOS/ARM targets can be restored once systemd support
# lands (see docs/plan-linux-service.md).

on:
  push:
    tags:
      - "*"

  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --release --target x86_64-pc-windows-msvc --verbose

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path target/x86_64-pc-windows-msvc/release/rathole-x.exe -DestinationPath rathole-x-x86_64-pc-windows-msvc.zip

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: rathole-x-x86_64-pc-windows-msvc.zip
          generate_release_notes: true
          draft: true
